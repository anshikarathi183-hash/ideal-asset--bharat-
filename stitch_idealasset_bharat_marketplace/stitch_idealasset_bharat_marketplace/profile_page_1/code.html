<script>
  // Add tactile ripple effect to menu items
  document.querySelectorAll('.menu-item').forEach(button => {
    button.addEventListener('pointerdown', function(e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const ripple = document.createElement('div');
      ripple.className = 'absolute bg-on-surface/5 rounded-full pointer-events-none transform scale-0 transition-transform duration-500 ease-out z-0';
      ripple.style.width = ripple.style.height = `${Math.max(rect.width, rect.height) * 2}px`;
      ripple.style.left = `${x - Math.max(rect.width, rect.height)}px`;
      ripple.style.top = `${y - Math.max(rect.width, rect.height)}px`;
      
      this.appendChild(ripple);
      
      requestAnimationFrame(() => {
        ripple.classList.remove('scale-0');
        ripple.classList.add('scale-100');
      });
      
      setTimeout(() => {
        ripple.style.opacity = '0';
        setTimeout(() => ripple.remove(), 300);
      }, 300);
    });
  });
  
  // Hide native scrollbar but allow scrolling

  `);
