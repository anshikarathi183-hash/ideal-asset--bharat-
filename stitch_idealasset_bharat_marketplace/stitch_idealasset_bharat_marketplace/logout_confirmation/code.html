<script>
  document.addEventListener('DOMContentLoaded', () => {
    const backdrop = document.getElementById('logout-modal-backdrop');
    const card = document.getElementById('logout-modal-card');
    const btnCancel = document.getElementById('btn-cancel');
    const btnLogout = document.getElementById('btn-logout');

    const closeModal = () => {
      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      
      setTimeout(() => {
        // In a real app, this would remove the node or trigger routing
        backdrop.style.display = 'none';
      }, 300);
    };

    btnCancel.addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });

    btnLogout.addEventListener('click', () => {
      // Add loading state
      const originalText = btnLogout.innerHTML;
      btnLogout.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Logging out...`;

      // Simulate API call
      setTimeout(() => {
        closeModal();
      }, 800);
    });
  });
