<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-secondary-fixed-variant": "#005322", "outline-variant": "#e0c0b0", "secondary-fixed": "#9df6ab", "primary-fixed-dim": "#ffb68e", "secondary": "#0a6d31", "tertiary": "#435c9e", "tertiary-fixed-dim": "#b3c5ff", "surface-dim": "#cedbef", "inverse-surface": "#253140", "on-background": "#0f1c2a", "surface-container-low": "#eef4ff", "inverse-primary": "#ffb68e", "primary-fixed": "#ffdbc9", "secondary-container": "#9af4a8", "on-secondary-container": "#137235", "primary-container": "#f97302", "on-error": "#ffffff", "inverse-on-surface": "#e9f1ff", "surface-bright": "#f8f9ff", "on-primary": "#ffffff", "primary": "#9b4500", "background": "#f8f9ff", "on-primary-container": "#562300", "surface": "#f8f9ff", "on-surface-variant": "#584236", "outline": "#8c7164", "on-primary-fixed-variant": "#763300", "on-error-container": "#93000a", "on-surface": "#0f1c2a", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "surface-container-high": "#dce9fd", "tertiary-fixed": "#dbe1ff", "tertiary-container": "#8098df", "surface-tint": "#9b4500", "on-tertiary-container": "#102e6f", "error-container": "#ffdad6", "on-tertiary-fixed-variant": "#2a4385", "on-primary-fixed": "#331200", "surface-container-highest": "#d6e4f7", "error": "#ba1a1a", "on-secondary-fixed": "#00210a", "on-tertiary": "#ffffff", "surface-variant": "#d6e4f7", "surface-container": "#e4efff", "secondary-fixed-dim": "#82da91", "on-tertiary-fixed": "#00184a" }, "borderRadius": { "DEFAULT": "16px" } } } }</script><style>@layer base { .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface pt-safe pb-safe"><main><div class="flex flex-col w-full bg-surface">
<div class="px-container-margin py-lg flex flex-col gap-xl">
<!-- Header Area -->
<div class="flex flex-col gap-sm pt-xl">
<h1 class="text-headline-lg-mobile text-[#0A2A6B] font-headline-lg-mobile">Welcome back.</h1>
<p class="text-body-md text-on-surface-variant font-body-md">Sign in to manage your assets securely.</p>
</div>
<!-- Toggle & Form -->
<div class="bg-surface-container-lowest shadow-md rounded-[16px] p-container-margin flex flex-col gap-lg" id="auth-container">
<!-- Custom Toggle -->
<div class="relative flex bg-surface-container rounded-full p-1" id="auth-toggle">
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-surface-container-lowest rounded-full shadow-sm transition-transform duration-300 ease-out" id="toggle-pill"></div>
<button class="flex-1 py-2 text-label-md font-label-md text-on-surface relative z-10" onclick="switchMode('login')">Log In</button>
<button class="flex-1 py-2 text-label-md font-label-md text-on-surface-variant relative z-10" onclick="switchMode('signup')">Sign Up</button>
</div>
<div class="flex flex-col gap-md">
<!-- Input Group -->
<div class="flex flex-col gap-2">
<label class="text-label-md text-on-surface-variant font-label-md">Email or Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full bg-surface-container-lowest outline-none py-3 pl-10 pr-4 rounded-[8px] shadow-[inset_0_0_0_1px_rgba(140,113,100,0.2)] focus:shadow-[inset_0_0_0_2px_#F97302] text-body-md font-body-md text-on-surface transition-shadow" placeholder="Enter your details" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2" id="password-field">
<label class="text-label-md text-on-surface-variant font-label-md">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest outline-none py-3 pl-10 pr-10 rounded-[8px] shadow-[inset_0_0_0_1px_rgba(140,113,100,0.2)] focus:shadow-[inset_0_0_0_2px_#F97302] text-body-md font-body-md text-on-surface transition-shadow" placeholder="Enter your password" type="password"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline text-[20px] cursor-pointer">visibility_off</span>
</div>
<div class="flex justify-end mt-1">
<a class="text-label-md font-label-md text-[#0A2A6B]" href="#">Forgot password?</a>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mt-sm">
<button class="w-full bg-[#F97302] text-on-primary py-3 rounded-full text-body-lg font-body-lg font-bold shadow-[0_4px_20px_rgba(10,42,107,0.1)] active:scale-[0.98] transition-transform">
          Continue
        </button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 text-label-md text-outline font-label-md">OR</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full bg-surface-container-lowest flex items-center justify-center gap-3 py-3 rounded-full shadow-[inset_0_0_0_1px_rgba(140,113,100,0.2)] active:bg-surface-container transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-body-md font-body-md text-on-surface font-medium">Continue with Google</span>
</button>
</div>
</div>
<!-- Security Note -->
<div class="flex items-center justify-center gap-2 mt-auto">
<span class="material-symbols-outlined text-outline text-[16px]">verified_user</span>
<p class="text-label-md font-label-md text-outline">Institutional-grade security active</p>
</div>
</div>
</div>
<script>
  function switchMode(mode) {
    const pill = document.getElementById('toggle-pill');
    const headerTitle = document.querySelector('h1');
    const headerDesc = document.querySelector('p');
    const buttons = document.querySelectorAll('#auth-toggle button');
    const pwField = document.getElementById('password-field');
    const actionBtn = document.querySelector('#auth-container > div:last-of-type > button:first-child');
    
    if (mode === 'signup') {
      pill.style.transform = 'translateX(100%)';
      buttons[0].classList.replace('text-on-surface', 'text-on-surface-variant');
      buttons[1].classList.replace('text-on-surface-variant', 'text-on-surface');
      headerTitle.textContent = 'Create an account.';
      headerDesc.textContent = 'Join the trusted network to manage assets.';
      actionBtn.textContent = 'Verify with OTP';
      
      // Animate out password for cleaner signup flow (OTP assumed next step)
      pwField.style.opacity = '0';
      setTimeout(() => {
        pwField.style.display = 'none';
      }, 200);

    } else {
      pill.style.transform = 'translateX(0)';
      buttons[1].classList.replace('text-on-surface', 'text-on-surface-variant');
      buttons[0].classList.replace('text-on-surface-variant', 'text-on-surface');
      headerTitle.textContent = 'Welcome back.';
      headerDesc.textContent = 'Sign in to manage your assets securely.';
      actionBtn.textContent = 'Continue';
      
      // Animate back in
      pwField.style.display = 'flex';
      setTimeout(() => {
        pwField.style.opacity = '1';
      }, 10);
    }
  }
</script></main></body></html>
